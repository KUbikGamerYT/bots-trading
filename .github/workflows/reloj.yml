name: Reloj (lanza los bots a su hora)

# GitHub retrasa mucho los "schedule" (a veces 4-7 h). Este workflow hace de reloj:
# se queda encendido ~5h45m, lanza "bots.yml" a su hora y al terminar se relanza a sí mismo.
# Frecuencia: cada 15 min con la bolsa europea abierta (lun-vie 8:00-17:45 Madrid), cada hora el resto.
# El "schedule" de abajo solo sirve para volver a arrancarlo si la cadena se corta.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */3 * * *"

permissions:
  actions: write

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Europe/Madrid
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Lanzar los bots a su hora
        run: |
          fin=$(( $(date +%s) + 345*60 ))
          lanzar() { for i in 1 2 3; do gh workflow run bots.yml -R "$REPO" --ref main && return 0; sleep 20; done; echo "No se pudo lanzar bots.yml"; }
          siguiente() {   # segundos hasta el próximo turno
            ahora=$(date +%s); dia=$(date +%u); h=$((10#$(date +%H))); m=$((10#$(date +%M)))
            if [ "$dia" -le 5 ] && [ "$h" -ge 8 ] && [ "$h" -lt 18 ]; then paso=15; else paso=60; fi
            # turnos en los minutos 7, 22, 37, 52 (o solo el 7 si es cada hora)
            for extra in $(seq 1 75); do
              t=$(( (ahora/60 + extra) * 60 )); mm=$((10#$(date -d @$t +%M)))
              if [ $(( (mm - 7 + 60) % paso )) -eq 0 ]; then echo $(( t - ahora )); return; fi
            done
            echo 3600
          }
          lanzar
          while true; do
            espera=$(siguiente)
            [ $(( $(date +%s) + espera )) -ge $fin ] && break
            echo "Próximo lanzamiento en $((espera/60)) min"
            sleep "$espera"
            lanzar
          done

      - name: Relanzar el reloj
        if: success() || failure()   # si lo cancelas a mano, no se relanza
        run: gh workflow run reloj.yml -R "$REPO" --ref main
