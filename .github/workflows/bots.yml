name: Bots de trading (simulado)

on:
  schedule:
    - cron: "7 * * * *"      # cada hora, minuto 7 (hora UTC)
    - cron: "*/10 7-16 * * 1-5"  # cada ~10 min con la bolsa europea abierta (lun-vie, 8:00-17:30 hora de Madrid)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bots
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # lo último de main, no la versión de cuando se lanzó (evita conflictos si esperó en cola)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas yfinance

      - name: Bot diario (12 criptos)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot.py; } >> registro_bot.txt 2>&1 || echo "El bot diario falló (ver registro_bot.txt)"

      - name: Bot 4 horas (BTC)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_4h.py; } >> registro_bot_4h.txt 2>&1 || echo "El bot 4h falló (ver registro_bot_4h.txt)"

      - name: Bot acciones (España y Europa)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_acciones.py; } >> registro_bot_acciones.txt 2>&1 || echo "El bot de acciones falló (ver registro_bot_acciones.txt)"

      - name: Bot ETF (12 mercados)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_etf.py; } >> registro_bot_etf.txt 2>&1 || echo "El bot ETF falló (ver registro_bot_etf.txt)"

      - name: Bot oro 4h (Buy Sell Signal)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_oro.py; } >> registro_bot_oro.txt 2>&1 || echo "El bot de oro falló (ver registro_bot_oro.txt)"

      - name: Bot rebotes en índices (RSI 2)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_rebotes.py; } >> registro_bot_rebotes.txt 2>&1 || echo "El bot de rebotes falló (ver registro_bot_rebotes.txt)"

      - name: Experimento BTC 5 minutos
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_loco.py; } >> registro_bot_loco.txt 2>&1 || echo "El experimento falló (ver registro_bot_loco.txt)"

      - name: Agente IA (solo valorar; la IA decide los lunes en ia.yml)
        run: |
          { echo "--- $(date '+%d/%m/%Y %H:%M')"; python paper_bot_ia.py; } >> registro_bot_ia.txt 2>&1 || echo "El agente IA falló (ver registro_bot_ia.txt)"

      - name: Panel
        run: |
          python generar_panel.py
          for f in registro_bot.txt registro_bot_4h.txt registro_bot_acciones.txt registro_bot_etf.txt registro_bot_oro.txt registro_bot_rebotes.txt registro_bot_loco.txt registro_bot_ia.txt; do tail -n 600 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          tail -n 8 registro_bot.txt registro_bot_4h.txt registro_bot_acciones.txt registro_bot_etf.txt registro_bot_oro.txt registro_bot_rebotes.txt registro_bot_loco.txt registro_bot_ia.txt

      - name: Guardar resultados
        run: |
          git config user.name "bot-trading"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Bots: actualización $(date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: Preparar web del panel
        run: mkdir -p web && cp panel.html web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar-panel:
    needs: ejecutar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
